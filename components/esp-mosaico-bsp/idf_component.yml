version: "0.2.0"
description: Board Support Package for ESP-Mosaico
license: Apache-2.0

targets:
  - esp32s31

tags:
  - bsp

dependencies:
  idf: ">=6.2"

  espressif/esp_lvgl_adapter:
    version: "0.6.2"
    public: true
    rules:
      - if: $CONFIG{BSP_DISPLAY_ENABLE} == True

  lvgl/lvgl:
    version: ^9.5.0,<9.6.0
    rules:
      - if: $CONFIG{BSP_DISPLAY_ENABLE} == True

  espressif/esp_lcd_co5300: ^2.2

  espressif/esp_lcd_touch_cst9220: ^0.1

  espressif/spi_nand_flash:
    version: "^1.3.0"
    public: true

  espressif/esp_codec_dev:
    version: "~1.6"
    public: true

  espressif/button:
    version: "^4"
    public: true

  espressif2022/bmi270:
    version: "^1.1.0~2"
    public: true

  tangyumei3535/bmm150_sensorapi:
    version: "^1.0.0"
    public: true

  espressif/bq27220:
    version: "^0.1.1~1"
    public: true
